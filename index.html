<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>樂在齡中｜數獨小教室</title><link rel="stylesheet" href="css/style.css?v=15"></head><body class="font-normal">
<header><img class="brand-logo" src="assets/lezaiblingzhong-logo.png" alt="樂在齡中標誌"><div class="brand"><h1>數獨新手村</h1></div><nav><button id="home-top" aria-label="回到主頁">主</button><button id="font-smaller" aria-label="縮小字體">小</button><button id="font-larger" aria-label="放大字體">大</button></nav></header>
<main><section id="home" class="panel"><div class="home-heading"><h2>一次學會一件事</h2><button id="resume-progress" class="completed-progress" type="button" disabled><span>( <b id="completed-count">0</b> / 100 )</span> 已完成</button></div><div class="lessons">
<article><b>01</b><div><h3>第一步：橫排</h3><p>看看一排數字，找出缺少的數字。</p></div><button class="start" data-id="row">開始練習</button></article>
<article><b>02</b><div><h3>第二步：直排</h3><p>看看一直排數字，找出缺少的數字。</p></div><button class="start" data-id="column">開始練習</button></article>
<article><b>03</b><div><h3>第三步：四宮格</h3><p>看看小方格裡，缺少哪一個數字。</p></div><button class="start" data-id="box">開始練習</button></article>
<article><b>04</b><div><h3>第四步：橫排＋直排</h3><p>同時參考直排與橫排的線索，找出問號的答案。</p></div><button class="start" data-id="rowcol">開始練習</button></article>
</div><p class="note">不用登入，也不計時。慢慢想就可以。</p></section>
<section id="game" class="panel hidden"><div class="gamehead"><h2 id="title">第一步：橫排</h2><strong><span id="progress">1</span> / 100</strong></div><p id="instruction" class="instruction"></p><div class="puzzle-area"><div id="grid"></div></div><p id="feedback" role="status">請觀察格子，再選擇下方數字。</p><div class="pad"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button></div><div class="gamefoot"><span id="question">第 1 題</span><button id="hint" aria-label="提示">💡</button></div></section></main>
<div id="modal" class="backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog"><div class="check">✓</div><h2 id="modal-title">這一步完成了！</h2><p id="modal-message"></p><div class="actions"><button id="next">下一步</button><button id="modal-home">回到主頁</button></div></div></div><footer>樂在齡中｜不比速度，只要一步一步學會。</footer><script src="js/app.js?v=15"></script></body></html>
