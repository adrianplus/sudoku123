<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087bdc">
<title translate="no">樂在齡中｜數獨新手村</title>
<link rel="stylesheet" href="css/welcome.css?v=v116-mobile-test">
</head>
<body>
<main class="poster-shell">
  <div class="poster-stage">
    <img class="poster-art" src="assets/language-entry-mobile.webp" alt="樂在齡中數獨新手村語言選擇入口：完整地球背景與世界各地人物牽手" draggable="false">
    <div class="language-grid" role="group" aria-label="Choose your language">
      <button type="button" class="language-button" data-lang="zh-TW" aria-label="繁體中文"><span>繁體中文</span></button>
      <button type="button" class="language-button" data-lang="en" aria-label="English"><span>English</span></button>
      <button type="button" class="language-button" data-lang="es-419" aria-label="Español"><span>Español</span></button>
      <button type="button" class="language-button" data-lang="fr" aria-label="Français"><span>Français</span></button>
      <button type="button" class="language-button" data-lang="pt-BR" aria-label="Português"><span>Português</span></button>
      <button type="button" class="language-button" data-lang="ru" aria-label="Русский"><span>Русский</span></button>
      <button type="button" class="language-button" data-lang="id" aria-label="Bahasa Indonesia"><span>Bahasa Indonesia</span></button>
      <button type="button" class="language-button" data-lang="de" aria-label="Deutsch"><span>Deutsch</span></button>
      <button type="button" class="language-button" data-lang="ja" aria-label="日本語"><span>日本語</span></button>
      <button type="button" class="language-button" data-lang="vi" aria-label="Tiếng Việt"><span>Tiếng Việt</span></button>
      <button type="button" class="language-button" data-lang="tr" aria-label="Türkçe"><span>Türkçe</span></button>
      <button type="button" class="language-button" data-lang="ar" aria-label="العربية"><span lang="ar" dir="rtl">العربية</span></button>
      <button type="button" class="language-button" data-lang="hi" aria-label="हिन्दी"><span lang="hi">हिन्दी</span></button>
      <button type="button" class="language-button" data-lang="ko" aria-label="한국어"><span>한국어</span></button>
      <button type="button" class="language-button" data-lang="it" aria-label="Italiano"><span>Italiano</span></button>
      <button type="button" class="language-button" data-lang="zh-CN" aria-label="简体中文"><span>简体中文</span></button>
    </div>
  </div>
</main>
<script>
(() => {
  "use strict";
  const KEY = "lezaiblingzhong_sudoku_language";
  const allowed = ["zh-TW","en","es-419","es-ES","fr","pt-BR","ru","id","de","ja","vi","ko","it","zh-CN","tr","ar","hi"];
  const params = new URLSearchParams(location.search);
  let requested = params.get("lang");
  if (requested === "es") requested = "es-419";

  // Explicit language URLs remain deep links into the selected game language.
  if (requested && allowed.includes(requested)) {
    try {
      localStorage.setItem(KEY, requested);
      localStorage.setItem("lezaiblingzhong_language_chosen", "1");
    } catch (e) {}
    location.replace("village.html");
    return;
  }

  // A normal visit to index.html always shows the language gateway.
  // Remember the previous language visually, but never skip the gateway.
  let saved = "";
  try { saved = localStorage.getItem(KEY) || ""; } catch (e) {}
  if (allowed.includes(saved)) {
    const previous = document.querySelector('[data-lang="' + saved + '"]');
    if (previous) {
      previous.classList.add("is-last-used");
      previous.setAttribute("aria-label", previous.getAttribute("aria-label") + "（上次選擇）");
      previous.setAttribute("title", "上次選擇");
    }
  }

  document.querySelectorAll("[data-lang]").forEach(button => {
    button.addEventListener("click", () => {
      const lang = button.dataset.lang;
      if (!allowed.includes(lang)) return;
      try {
        localStorage.setItem(KEY, lang);
        localStorage.setItem("lezaiblingzhong_language_chosen", "1");
      } catch (e) {}
      location.href = "village.html";
    });
  });
})();
</script>
</body>
</html>
